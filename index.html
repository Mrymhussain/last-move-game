<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Last Move</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

  <script
    defer
    src="./js/data.js"
  ></script>

  <script
    defer
    src="./js/app.js"
  ></script>
</head>

<body>

  <main>

    <header class="game-header">

      <p class="level-label">
        LEVEL 1
      </p>

      <h1>Last Move</h1>

      <h2>Frozen Shore</h2>

    </header>


    <p id="moves">
      Moves Left: 10
    </p>


    <div id="game-board"></div>


    <p id="message">
      Press Start Game to begin!
    </p>


    <div id="controls">

      <button
        type="button"
        class="direction-btn"
        data-direction="up"
        aria-label="Move up"
      >
        ↑
      </button>


      <div class="control-row">

        <button
          type="button"
          class="direction-btn"
          data-direction="left"
          aria-label="Move left"
        >
          ←
        </button>

        <button
          type="button"
          class="direction-btn"
          data-direction="down"
          aria-label="Move down"
        >
          ↓
        </button>

        <button
          type="button"
          class="direction-btn"
          data-direction="right"
          aria-label="Move right"
        >
          →
        </button>

      </div>

    </div>


    <div id="game-buttons">

      <button
        type="button"
        id="start-btn"
      >
        Start Game
      </button>

      <button
        type="button"
        id="restart-btn"
      >
        Restart Level
      </button>

    </div>

  </main>

</body>

</html>
