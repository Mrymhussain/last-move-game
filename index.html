<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Last Move</title>

  <link rel="stylesheet" href="./css/style.css">

  <script defer src="./js/data.js"></script>
  <script defer src="./js/app.js"></script>
</head>

<body>

  <main>

    <h1>❄️ Last Move ❄️</h1>

    <h2>Penguin Escape</h2>

    <p class="instructions">
      Help the penguin reach home before the moves run out.
    </p>

    <p class="instructions">
      🐧 Penguin &nbsp;
      🧊 Ice &nbsp;
      ❌ Blocked &nbsp;
      🏠 Home
    </p>

    <p class="instructions">
      You have 10 moves. Choose your path carefully!
    </p>


    <p id="moves"></p>


    <div id="game-board"></div>


    <div id="controls">

      <button
        type="button"
        data-direction="up"
        aria-label="Move up"
      >
        ↑
      </button>

      <div>

        <button
          type="button"
          data-direction="left"
          aria-label="Move left"
        >
          ←
        </button>

        <button
          type="button"
          data-direction="down"
          aria-label="Move down"
        >
          ↓
        </button>

        <button
          type="button"
          data-direction="right"
          aria-label="Move right"
        >
          →
        </button>

      </div>

    </div>


    <p class="keyboard-text">
      You can also use your keyboard arrow keys.
    </p>


    <p id="message"></p>


    <div id="game-buttons">

      <button
        type="button"
        id="start-btn"
      >
        Start Game
      </button>

      <button
        type="button"
        id="restart-btn"
      >
        New Puzzle
      </button>

    </div>

  </main>

</body>

</html>
